name: CI

on:
  # O fluxo do projeto é branch -> merge na main: roda a cada push de qualquer branch (antes do merge).
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Uma execução nova cancela a anterior da mesma branch (economiza minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Sem .env no runner o Laravel assume "production", e a trava de segurança de produção (AppServiceProvider)
  # recusa subir. O CI roda em ambiente de teste. A APP_KEY é gerada ao acaso em cada job (nenhuma chave fica no repositório).
  APP_ENV: testing
  # Extensões que o sistema usa de verdade: sodium (criptografia do backup), zip (arquivos do backup), pdo_* e mbstring.
  PHP_EXTENSIONS: mbstring, intl, pdo_sqlite, pdo_mysql, zip, sodium, fileinfo, gd

jobs:
  style:
    name: Estilo (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Gera uma APP_KEY descartável (não fica no repositório)
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: vendor/bin/pint --test

  security:
    name: Dependências (vulnerabilidades)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Gera uma APP_KEY descartável (não fica no repositório)
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - run: composer validate --strict --no-check-publish
      - run: composer audit --locked --no-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high

  php-sqlite:
    name: Testes PHP ${{ matrix.php }} (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - name: Gera uma APP_KEY descartável (não fica no repositório)
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: composer check-platform-reqs
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test --compact

  php-mysql:
    name: Testes PHP (MySQL 8.4, igual à produção)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: trilha_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: trilha_ci
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v7
      - name: Gera uma APP_KEY descartável (não fica no repositório)
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test --compact

  backup-restore-mysql:
    # Prova que o backup criptografado de um MySQL real restaura idêntico em outro banco.
    name: Backup e restauração (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ''
      DB_DATABASE: smoke_source
      BACKUP_SMOKE_MYSQL: '1'
      BACKUP_SMOKE_DB_SOURCE: smoke_source
      BACKUP_SMOKE_DB_TARGET: smoke_target
    steps:
      - uses: actions/checkout@v7
      - name: Gera uma APP_KEY descartável (não fica no repositório)
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - name: Cria os bancos descartáveis
        run: |
          mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE smoke_source CHARACTER SET utf8mb4; CREATE DATABASE smoke_target CHARACTER SET utf8mb4;"
      - run: php artisan test tests/Feature/BackupRestoreMysqlTest.php

  frontend:
    name: Front-end (tipos e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Gera uma APP_KEY descartável (não fica no repositório)
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tipos (TypeScript)
        run: npx tsc --noEmit
      - name: Build de produção (Vite)
        run: npm run build
      - name: Confere que o build gerou os arquivos
        run: test -f public/build/manifest.json

  e2e-gantt:
    # Abre o Gantt num Chrome de verdade: cria, edita, põe predecessora, exclui, simula conflito entre duas pessoas
    # e confere a regra de acesso por projeto. Banco SQLite descartável, criado pelo próprio teste.
    name: Interface do Gantt (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Gera uma APP_KEY descartável (não fica no repositório)
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - run: composer install --prefer-dist --no-progress --no-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # O runner do GitHub já traz o Google Chrome; o teste usa esse navegador (nada para baixar).
      - run: npx playwright test
      - name: Guarda relatório e capturas quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-falha
          path: |
            playwright-report
            test-results
          retention-days: 7
